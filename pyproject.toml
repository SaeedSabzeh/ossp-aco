[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ossp-aco"
version = "2.0.0"
description = "Ant Colony Optimization with iterated local search for the Open-Shop Scheduling Problem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saeed Sabzeh" }]
keywords = ["ant-colony-optimization", "scheduling", "metaheuristics", "combinatorial-optimization", "operations-research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "matplotlib>=3.4"]

[project.scripts]
ossp = "ossp.cli:main"

[project.urls]
Homepage = "https://github.com/SaeedSabzeh/ossp-aco"

[tool.hatch.build.targets.wheel]
packages = ["src/ossp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
